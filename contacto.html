<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ponte en contacto con el equipo de HuertoHogar.">
    <title>HuertoHogar | Contacto</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="main-header">
        <div class="logo-container">
            <a href="index.html"><img src="img/logo.png" alt="Logo HuertoHogar"></a>
            <span class="brand-title">HuertoHogar</span>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blog</a></li>
                <li><a href="contacto.html" class="active">Contacto</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <a href="login.html" class="btn-secondary">Iniciar Sesión</a>
            <a href="carrito.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
        </div>
    </header>

    <main class="container">
        <h1>Contáctanos</h1>
        <form id="contact-form" class="custom-form" novalidate>
            <div class="form-group">
                <label for="name">Nombre Completo:</label>
                <input type="text" id="name" name="name" required>
                <span class="error-msg" id="error-name"></span>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required>
                <span class="error-msg" id="error-email"></span>
            </div>

            <div class="form-group">
                <label for="message">Mensaje:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
                <span class="error-msg" id="error-message"></span>
            </div>

            <button type="submit" class="btn-primary">Enviar Mensaje</button>
        </form>
    </main>

    <footer class="main-footer">
        <div class="footer-content container">
            <p>&copy; 2026 HuertoHogar. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="js/validations.js"></script>
</body>
</html>
