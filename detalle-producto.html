<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuertoHogar | Detalle del Producto</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="main-header">
        <div class="logo-container">
            <a href="index.html"><img src="img/logo.png" alt="Logo HuertoHogar" class="logo-img"></a>
            <span class="brand-title">HuertoHogar</span>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html" class="active">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blog</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <a href="login.html" class="btn-secondary">Iniciar Sesión</a>
            <a href="carrito.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
        </div>
    </header>

    <main class="container">
        <article class="product-detail-layout" id="product-detail-container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: center;">
            <!-- Se carga dinámicamente según el parámetro ?id= de la URL -->
            <p>Cargando producto...</p>
        </article>
    </main>

    <footer class="main-footer">
        <div class="footer-content container">
            <p>&copy; 2026 HuertoHogar. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('product-detail-container');
            const params = new URLSearchParams(window.location.search);
            const productId = params.get('id') || 1; // 1 por defecto si se entra sin parámetro
            const product = getProductById(productId);

            if (!product) {
                container.innerHTML = '<p>Producto no encontrado. <a href="productos.html">Volver al catálogo</a>.</p>';
                return;
            }

            container.innerHTML = `
                <img src="${product.image}" alt="${product.name}" style="width: 100%; border-radius: 8px;">
                <div>
                    <h1>${product.name}</h1>
                    <p class="price" style="font-size: 1.5rem; font-weight: bold; color: var(--color-primary);">
                        $${product.price.toLocaleString('es-CL')} / kg
                    </p>
                    <p style="margin: 1rem 0;">${product.description}</p>

                    <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1.5rem;">
                        <label for="quantity">Cantidad (kg):</label>
                        <input type="number" id="quantity" value="1" min="1" style="width: 60px; padding: 0.5rem;">
                    </div>

                    <button class="btn-primary" id="add-to-cart-btn">Añadir al Carrito</button>
                </div>
            `;

            document.getElementById('add-to-cart-btn').addEventListener('click', () => {
                const quantityInput = document.getElementById('quantity');
                const quantity = parseInt(quantityInput.value, 10) || 1;
                addToCart(product.id, quantity);
            });
        });
    </script>
</body>
</html>
