<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuertoHogar | Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="main-header">
        <div class="logo-container">
            <a href="index.html"><img src="img/logo.png" alt="Logo HuertoHogar" class="logo-img"></a>
            <span class="brand-title">HuertoHogar</span>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blog</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1>Iniciar Sesión</h1>
        <form class="custom-form">
            <div class="form-group">
                <label for="login-email">Correo Electrónico:</label>
                <input type="email" id="login-email" required>
            </div>

            <div class="form-group">
                <label for="login-password">Contraseña:</label>
                <input type="password" id="login-password" required>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%;">Ingresar</button>
            <p style="margin-top: 1rem; text-align: center;">
                ¿No tienes cuenta? <a href="registro.html" style="color: var(--color-primary); font-weight: bold;">Regístrate aquí</a>
            </p>
        </form>
    </main>

    <footer class="main-footer">
        <div class="footer-content container">
            <p>&copy; 2026 HuertoHogar. Todos los derechos reservados.</p>
        </div>
    </footer>
</body>
</html>
