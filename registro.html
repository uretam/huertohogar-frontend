<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuertoHogar | Registro de Usuario</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="main-header">
        <div class="logo-container">
            <a href="index.html"><img src="img/logo.png" alt="Logo HuertoHogar" class="logo-img"></a>
            <span class="brand-title">HuertoHogar</span>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blog</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <a href="login.html" class="btn-secondary">Iniciar Sesión</a>
            <a href="carrito.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
        </div>
    </header>

    <main class="container">
        <h1>Registro de Nuevo Cliente</h1>
        <form id="register-form" class="custom-form" novalidate>
            <div class="form-group">
                <label for="reg-name">Nombre Completo:</label>
                <input type="text" id="reg-name" name="name" required>
                <span class="error-msg" id="error-reg-name"></span>
            </div>

            <div class="form-group">
                <label for="reg-email">Correo Electrónico:</label>
                <input type="email" id="reg-email" name="email" required>
                <span class="error-msg" id="error-reg-email"></span>
            </div>

            <div class="form-group">
                <label for="reg-password">Contraseña:</label>
                <input type="password" id="reg-password" name="password" required minlength="6">
                <span class="error-msg" id="error-reg-password"></span>
            </div>

            <div class="form-group">
                <label for="reg-confirm-password">Confirmar Contraseña:</label>
                <input type="password" id="reg-confirm-password" name="confirm-password" required minlength="6">
                <span class="error-msg" id="error-reg-confirm-password"></span>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%;">Crear Cuenta</button>
            <p style="margin-top: 1rem; text-align: center;">
                ¿Ya tienes cuenta? <a href="login.html" style="color: var(--color-primary); font-weight: bold;">Inicia sesión</a>
            </p>
        </form>
    </main>

    <footer class="main-footer">
        <div class="footer-content container">
            <p>&copy; 2026 HuertoHogar. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
